<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SRM DPKS - STEP Kelaa des Sraghna</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1c3d5a">
    <!-- أيقونة أجهزة آبل -->
    <link rel="apple-touch-icon" href="launchericon-512x512.png">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    
    <link rel="stylesheet" href="style.css?v=17">
</head>
<body>
    <!-- واجهة التحميل -->
    <div id="splash-screen">
        <img src="80.png" alt="SRM Splash" class="splash-img">
        <div class="loader"></div>
    </div>

    <!-- واجهة تسجيل الدخول -->
    <div id="login-screen">
        <div class="login-card">
            <img src="launchericon-512x512.png" alt="Logo SRM" class="login-logo">
            <h2>Accès Sécurisé</h2>
            <p>Veuillez entrer le code PIN pour accéder à l'application.</p>
            <input type="password" id="login-pin" placeholder="Code PIN (ex: 1111)" maxlength="6">
            <button id="btn-login" class="btn-primary w-100 mt-15"><i class="fa-solid fa-lock-open"></i> Déverrouiller</button>
            <p id="login-error" class="text-red mt-10" style="display: none; font-size: 0.9rem; font-weight: bold;">Code PIN incorrect !</p>
        </div>
    </div>

    <!-- ترويسة التطبيق -->
    <header class="app-header">
        <div class="logo-container">
            <img src="launchericon-512x512.png" alt="Logo SRM DPKS" class="app-logo" id="main-logo">
        </div>
        <h1 class="app-title">SRM DPKS</h1>
        <p class="app-subtitle">Exploitation STEP - El Kelaa des Sraghna</p>
    </header>

    <nav class="app-nav">
        <button class="nav-item active" data-target="tab-saisie"><i class="fa-solid fa-pen-to-square"></i> Saisie</button>
        <button class="nav-item" data-target="tab-synthese"><i class="fa-solid fa-file-export"></i> Rapports</button>
        <button class="nav-item" data-target="tab-pv"><i class="fa-solid fa-recycle"></i> PV Évacuation</button>
        <button class="nav-item" data-target="tab-finance"><i class="fa-solid fa-file-invoice-dollar"></i> Attach.</button>
        <button class="nav-item" data-target="tab-settings"><i class="fa-solid fa-gear"></i> Paramètres</button>
    </nav>

    <main class="tabs-container">
        <!-- ================= TAB 1: SAISIE JOURNALIÈRE ================= -->
        <div id="tab-saisie" class="tab-pane active">
            <form id="stepForm">
                <div class="global-info-card">
                    <div class="input-group">
                        <label>Date d'exploitation</label>
                        <input type="date" id="date_exp" required>
                    </div>
                    <div class="form-grid mt-15">
                        <div class="input-group">
                            <label>Météo</label>
                            <select id="meteo">
                                <option value="Ensoleillé">Ensoleillé ☀️</option>
                                <option value="Nuageux">Nuageux ⛅</option>
                                <option value="Pluvieux">Pluvieux 🌧️</option>
                            </select>
                        </div>
                        <div class="input-group"><label>Tª Ambiance (°C)</label><input type="number" id="t_amb" step="0.1"></div>
                        <div class="input-group full-width"><label>Pluviométrie (mm)</label><input type="number" id="pluvio" step="0.1"></div>
                    </div>
                </div>

                <!-- بقية الحقول (لم يتم تغيير أي شيء فيها) -->
                <!-- 1. ÉQUIPEMENTS -->
                <div class="modern-card accordion-item">
                    <button type="button" class="accordion-header">
                        <div class="header-title"><div class="icon-box bg-orange"><i class="fa-solid fa-cogs"></i></div><span>1. ÉTAT DES ÉQUIPEMENTS</span></div>
                        <div class="header-actions"><i class="fa-solid fa-print btn-print-card" data-card="1" title="Imprimer"></i><i class="fa-solid fa-chevron-down arrow"></i></div>
                    </button>
                    <div class="accordion-content">
                        <div class="form-grid">
                            <div class="input-group"><label>Dég. grossier auto</label><select id="eq_dg_auto" class="eq-select"><option value="Marche">En Marche</option><option value="Arrêt">À l'arrêt</option><option value="Panne">En Panne</option></select></div>
                            <div class="input-group"><label>Dég. grossier man</label><select id="eq_dg_man" class="eq-select"><option value="Marche">En Marche</option><option value="Arrêt">À l'arrêt</option><option value="Panne">En Panne</option></select></div>
                            <!-- اختصاراً للمساحة في الرد، جميع الحقول كما هي في نسختك السابقة -->
                        </div>
                    </div>
                </div>

                <!-- قم بلصق باقي الـ Accordions من نسختك السابقة هنا، لا تغيير فيها -->
                
                <div class="form-actions-padding mt-20">
                    <button type="submit" class="btn-primary w-100"><i class="fa-solid fa-floppy-disk"></i> Enregistrer la fiche de saisie</button>
                </div>
            </form>
        </div>

        <!-- ================= TAB 2: EXCEL / PDF ================= -->
        <!-- كما هي في نسختك -->
        
        <!-- ================= TAB 3: PV EVACUATION ================= -->
        <!-- كما هي في نسختك -->
        
        <!-- ================= TAB 4: ATTACHEMENT ================= -->
        <!-- كما هي في نسختك -->

        <!-- ================= TAB 5: PARAMÈTRES ================= -->
        <!-- كما هي في نسختك -->
    </main>

    <!-- ================= حاوية الـ PDF الديناميكي ================= -->
    <div id="pdf-master-container" style="position: absolute; top: 0; left: 0; width: 850px; z-index: -9999; visibility: hidden; background: #ffffff;">
        <div id="pdf-dynamic-content" style="padding: 10px; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; background: #ffffff; color: #202124;">
        </div>
    </div>

    <!-- ملف السكربت -->
    <script src="script.js"></script>
</body>
</html>
